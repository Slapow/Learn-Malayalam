# Project-wide Gradle settings.
# JVM arguments: 4GB heap, fast parallel GC, and explicit UTF-8
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Parallel execution & caching
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Utilize the Snapdragon X Elite cores (8-10 workers keeps the laptop responsive while building fast)
org.gradle.workers.max=8

# Code style and Android packaging
kotlin.code.style=official
android.nonTransitiveRClass=true

# FAST KOTLIN COMPILATION: Use the background daemon + incremental compilation
kotlin.compiler.execution.strategy=daemon
kotlin.incremental=true

# Keep the build alive without google-services.json
googleServices.missing.passthrough=true

# Enable parallel sync for newer Gradle distributions
org.gradle.tooling.parallel=true

org.gradle.java.installations.auto-download=false